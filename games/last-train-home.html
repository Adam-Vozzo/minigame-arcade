<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Train Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚉</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000}
  body{font-family:"Courier New",ui-monospace,monospace;color:#e8e4d8}
  #c{display:block;width:100%;height:100%}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #timer{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    font-size:52px;letter-spacing:.05em;color:#ffb347;text-shadow:0 0 16px rgba(255,179,71,.5);
    font-weight:bold;
  }
  #timer.danger{color:#ff5c5c;animation:pulse .5s infinite}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.12)}}
  #subtitle{
    position:absolute;bottom:20%;left:50%;transform:translateX(-50%);
    font-size:20px;letter-spacing:.15em;color:#fff;text-shadow:0 2px 8px #000;
    background:rgba(0,0,0,.45);padding:6px 18px;white-space:nowrap;
  }
  #stamina{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:220px;height:10px;
    border:1px solid #6a7480;background:rgba(0,0,0,.4)}
  #stambar{height:100%;width:100%;background:#57d7e0;transition:background .2s}
  #seed{position:absolute;bottom:12px;right:14px;font-size:11px;color:#6a7480;letter-spacing:.1em}
  .back{position:fixed;top:14px;left:14px;z-index:30;color:#8a93a0;text-decoration:none;font-size:13px;
    letter-spacing:.15em;background:rgba(0,0,0,.5);padding:6px 10px;border:1px solid #2a3138}
  .back:hover{color:#ffb347;border-color:#ffb347}
  #overlay{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(5,7,9,.82);cursor:pointer;text-align:center;
  }
  #overlay .panel{max-width:560px;padding:32px;border:2px solid #2a3138;background:#101418}
  #overlay h1{color:#ffb347;font-size:34px;letter-spacing:.06em;margin-bottom:10px}
  #overlay p{color:#8a93a0;font-size:14px;line-height:1.7;margin:8px 0}
  #overlay .go{margin-top:18px;color:#e8e4d8;font-size:16px;letter-spacing:.2em;animation:blink 1.1s steps(2) infinite}
  #overlay .result{font-size:22px;color:#e8e4d8;margin:6px 0}
  #overlay .win{color:#7dff9b}#overlay .lose{color:#ff5c5c}
  @keyframes blink{50%{opacity:.2}}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0;transition:opacity .3s}
</style>

<body>
<canvas id="c"></canvas>
<div id="vignette"></div><div id="flash"></div>
<a class="back" href="../index.html">◂ MENU</a>
<div class="hud">
  <div id="timer">22.0</div>
  <div id="subtitle" hidden></div>
  <div id="stamina"><div id="stambar"></div></div>
  <div id="seed"></div>
</div>
<div id="overlay">
  <div class="panel">
    <h1>LAST TRAIN HOME</h1>
    <p id="ovMsg">The last train leaves in 22 seconds. The platform is long.
    The obstacles are freshly rearranged. Your legs are all you have.</p>
    <p>WASD move · MOUSE look · SHIFT sprint · SPACE hop<br>
       R restart same layout · N new layout</p>
    <div class="go" id="ovGo">CLICK TO RUN</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let seed=(Math.random()*0xffffffff)>>>0, rng=mulberry32(seed);

/* ---------- tiny audio ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return AC }
function beep(f,dur=0.12,type='square',vol=0.08,when=0){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.value=vol;
  g.gain.setValueAtTime(vol,a.currentTime+when);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+when+dur);
  o.connect(g).connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+0.02);
}
function thump(vol=0.25){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(90,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(35,a.currentTime+0.15);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.2);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+0.25);
}
function chime(){beep(880,.18,'sine',.09);beep(660,.25,'sine',.09,.18)}

/* ---------- canvas textures ---------- */
function makeTex(draw,w=256,h=256,repX=1,repY=1){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repX,repY);
  t.magFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const floorTex=makeTex((g,w,h)=>{
  g.fillStyle='#7d7a72';g.fillRect(0,0,w,h);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const v=200+((x*7+y*13)%5)*6;
    g.fillStyle=`rgb(${v-70},${v-72},${v-80})`;
    g.fillRect(x*32+1,y*32+1,30,30);
  }
},256,256,4,32);
const wallTex=makeTex((g,w,h)=>{
  g.fillStyle='#cfc9b8';g.fillRect(0,0,w,h);
  g.strokeStyle='#a8a292';
  for(let y=0;y<8;y++)for(let x=0;x<8;x++)g.strokeRect(x*32+.5,y*32+.5,32,32);
  g.fillStyle='#b3402e';g.fillRect(0,96,w,20);
},256,256,16,1);
const trainTex=makeTex((g,w,h)=>{
  g.fillStyle='#3a4c5c';g.fillRect(0,0,w,h);
  g.fillStyle='#1c2630';g.fillRect(0,h-30,w,30);
  g.fillStyle='#ffd98a';
  for(let x=8;x<w-40;x+=64)g.fillRect(x,40,44,60);
  g.fillStyle='#25313d';g.fillRect(0,120,w,24);
},256,160,8,1);

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0c10);
scene.fog=new THREE.Fog(0x0a0c10,10,55);
const camera=new THREE.PerspectiveCamera(74,2,0.1,120);

scene.add(new THREE.HemisphereLight(0xcfd8e8,0x22242a,0.75));
const amb=new THREE.AmbientLight(0x404550,0.6);scene.add(amb);

/* platform geometry: player runs toward -z; platform x in [-4,4] */
const PLAT_LEN=78, DOOR_Z=-64;
const world=new THREE.Group();scene.add(world);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,PLAT_LEN+10),
  new THREE.MeshLambertMaterial({map:floorTex}));
floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-PLAT_LEN/2+6);world.add(floor);

const wallMat=new THREE.MeshLambertMaterial({map:wallTex});
const wall=new THREE.Mesh(new THREE.PlaneGeometry(PLAT_LEN+10,4),wallMat);
wall.rotation.y=-Math.PI/2;wall.position.set(4,2,-PLAT_LEN/2+6);world.add(wall);
const backWall=new THREE.Mesh(new THREE.PlaneGeometry(8,4),wallMat.clone());
backWall.position.set(0,2,6);backWall.rotation.y=Math.PI;world.add(backWall);

const ceil=new THREE.Mesh(new THREE.PlaneGeometry(8,PLAT_LEN+10),
  new THREE.MeshLambertMaterial({color:0x2b2f36}));
ceil.rotation.x=Math.PI/2;ceil.position.set(0,3.4,-PLAT_LEN/2+6);world.add(ceil);

/* fluorescent strips + a few point lights */
const stripMat=new THREE.MeshBasicMaterial({color:0xeef2ff});
for(let z=2;z>-PLAT_LEN;z-=8){
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.06,3.4),stripMat);
  s.position.set(0,3.36,z);world.add(s);
}
for(let z=-6;z>-PLAT_LEN;z-=16){
  const pl=new THREE.PointLight(0xdfe8ff,14,26,1.8);
  pl.position.set(0,3.1,z);world.add(pl);
}

/* posters */
const posterTexts=[['VISIT','THE SEA','#2a6f97'],['SOUP','IS BACK','#9b2226'],
  ['LEARN','TO JUGGLE','#6a4c93'],['BIG','WATCH SALE','#386641'],['MIND','THE GAP','#b3402e']];
posterTexts.forEach((p,i)=>{
  const t=makeTex((g)=>{g.fillStyle=p[2];g.fillRect(0,0,256,256);
    g.fillStyle='#f4f1e6';g.font='bold 44px monospace';g.textAlign='center';
    g.fillText(p[0],128,110);g.fillText(p[1],128,164);
    g.strokeStyle='#f4f1e6';g.lineWidth=6;g.strokeRect(10,10,236,236);});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshLambertMaterial({map:t}));
  m.position.set(3.95,1.9,-6-i*13);m.rotation.y=-Math.PI/2;world.add(m);
});

/* the train, parked along x<-4, z from -12 to -70 */
const train=new THREE.Group();world.add(train);
const trainBody=new THREE.Mesh(new THREE.BoxGeometry(2.8,3,58),
  new THREE.MeshLambertMaterial({map:trainTex}));
trainBody.position.set(-5.9,1.5,-41);train.add(trainBody);
/* doorway cut: door frame glow at DOOR_Z */
const frame=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.6,2.0),
  new THREE.MeshBasicMaterial({color:0x101418}));
frame.position.set(-4.45,1.3,DOOR_Z);train.add(frame);
const doorGlow=new THREE.Mesh(new THREE.PlaneGeometry(1.7,2.4),
  new THREE.MeshBasicMaterial({color:0xfff2c8}));
doorGlow.rotation.y=Math.PI/2;doorGlow.position.set(-4.34,1.3,DOOR_Z);train.add(doorGlow);
const doorMat=new THREE.MeshLambertMaterial({color:0x51697d});
const doorL=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.4,0.85),doorMat);
const doorR=doorL.clone();
doorL.position.set(-4.3,1.3,DOOR_Z-0.85);doorR.position.set(-4.3,1.3,DOOR_Z+0.85);
train.add(doorL,doorR);
const doorLight=new THREE.PointLight(0xffe9a8,10,8,1.6);
doorLight.position.set(-3.6,2.2,DOOR_Z);train.add(doorLight);
/* green "board here" lamp */
const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),
  new THREE.MeshBasicMaterial({color:0x44ff77}));
lamp.position.set(-4.2,2.9,DOOR_Z);train.add(lamp);

/* departure board near spawn */
const boardTex=makeTex((g)=>{
  g.fillStyle='#0c0e10';g.fillRect(0,0,512,128);
  g.fillStyle='#ffb347';g.font='bold 34px monospace';
  g.fillText('LAST TRAIN  ····  DOORS CLOSING SOON',18,52);
  g.fillStyle='#ff5c5c';g.fillText('RUN.',18,100);
},512,128);
const board=new THREE.Mesh(new THREE.PlaneGeometry(4,1),
  new THREE.MeshBasicMaterial({map:boardTex}));
board.position.set(0,2.6,-2);world.add(board);

/* ---------- obstacles (rebuilt per layout) ---------- */
const obsGroup=new THREE.Group();world.add(obsGroup);
let colliders=[]; // {minX,maxX,minZ,maxZ,h,type}
let people=[];    // {mesh,baseX,amp,speed,phase,z,r}
let slickZones=[];// {x,z,r}

const benchGeo=new THREE.BoxGeometry(2.2,0.75,0.6);
const benchMat=new THREE.MeshLambertMaterial({color:0x8a5a2b});
const pillarGeo=new THREE.BoxGeometry(0.9,3.4,0.9);
const pillarMat=new THREE.MeshLambertMaterial({color:0x9aa3ad});
const bagMat=new THREE.MeshLambertMaterial({color:0x6a4c93});
const bagMat2=new THREE.MeshLambertMaterial({color:0x386641});
const coneMat=new THREE.MeshLambertMaterial({color:0xffd23f});
const personMat=new THREE.MeshLambertMaterial({color:0x51697d});
const headMat=new THREE.MeshLambertMaterial({color:0xd9b38c});

function addBox(x,z,w,d,h,mesh){
  mesh.position.set(x,h/2,z);obsGroup.add(mesh);
  colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,h});
}
function buildLayout(){
  obsGroup.clear();colliders=[];people=[];slickZones=[];
  rng=mulberry32(seed);
  document.getElementById('seed').textContent='LAYOUT #'+seed.toString(16).toUpperCase();
  /* rows of obstacles every ~4.5m from z=-12 to -56, always leaving a gap */
  for(let z=-12;z>-56;z-=4.5){
    const kind=rng();
    const gapX=-3+rng()*6; // guaranteed corridor
    if(kind<0.30){ // bench(es)
      for(let i=0;i<2;i++){
        const x=-2.6+rng()*5.2;
        if(Math.abs(x-gapX)<1.6) continue;
        addBox(x,z+rng()*2-1,2.2,0.6,0.75,new THREE.Mesh(benchGeo,benchMat));
      }
    }else if(kind<0.5){ // pillar
      const x=Math.abs(gapX)<1.2? (gapX>0?-2:2)+rng():-0.5+rng();
      addBox(x,z,0.9,0.9,3.4,new THREE.Mesh(pillarGeo,pillarMat));
    }else if(kind<0.72){ // luggage cluster
      const n=2+Math.floor(rng()*3);
      for(let i=0;i<n;i++){
        const x=-3+rng()*6;
        if(Math.abs(x-gapX)<1.1) continue;
        const s=0.5+rng()*0.5;
        addBox(x,z+rng()*2.4-1.2,s,s,0.45+rng()*0.35,
          new THREE.Mesh(new THREE.BoxGeometry(s,0.45+rng()*0.35,s),rng()<0.5?bagMat:bagMat2));
      }
    }else if(kind<0.86){ // wet floor
      const x=-2.5+rng()*5;
      const cone=new THREE.Mesh(new THREE.ConeGeometry(0.24,0.6,6),coneMat);
      cone.position.set(x,0.3,z);obsGroup.add(cone);
      const puddle=new THREE.Mesh(new THREE.CircleGeometry(1.5,16),
        new THREE.MeshBasicMaterial({color:0x7ea8c4,transparent:true,opacity:0.28}));
      puddle.rotation.x=-Math.PI/2;puddle.position.set(x,0.012,z);obsGroup.add(puddle);
      slickZones.push({x,z,r:1.5});
    }else{ // commuter
      spawnPerson(z);
    }
  }
  /* a few extra roaming commuters */
  for(let i=0;i<4;i++) spawnPerson(-14-rng()*40);
}
function spawnPerson(z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,1.35,8),
    personMat.clone());
  body.material.color.setHSL(rng(),0.35,0.35);
  body.position.y=0.85;
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),headMat);
  head.position.y=1.72;
  g.add(body,head);
  g.position.set(0,0,z);obsGroup.add(g);
  people.push({mesh:g,baseX:-2+rng()*4,amp:1+rng()*2.2,speed:0.4+rng()*0.8,
    phase:rng()*6.28,z,r:0.42});
}

/* ---------- player state ---------- */
const P={x:0,z:2,y:0,vy:0,yaw:0,pitch:0,stam:100,stumble:0,slick:0};
const keys={};
let state='menu'; // menu|run|win|lose
let tLeft=22, attempts=0, doorOpen=1, shake=0, bobT=0, stepT=0, winT=0, loseT=0, announced=false;

const overlay=document.getElementById('overlay');
const ovMsg=document.getElementById('ovMsg'), ovGo=document.getElementById('ovGo');
const timerEl=document.getElementById('timer'), stamBar=document.getElementById('stambar');
const subEl=document.getElementById('subtitle'), flashEl=document.getElementById('flash');
let subTimer=0;
function say(t,dur=2.4){subEl.hidden=false;subEl.textContent=t;subTimer=dur}

function resetRun(){
  P.x=0;P.z=2;P.y=0;P.vy=0;P.yaw=0;P.pitch=0;P.stam=100;P.stumble=0;P.slick=0;
  tLeft=22;doorOpen=1;announced=false;
  doorL.position.z=DOOR_Z-0.85;doorR.position.z=DOOR_Z+0.85;
  train.position.z=0;doorGlow.visible=true;
  buildLayout();
}
function startRun(){
  attempts++;resetRun();state='run';overlay.style.display='none';
  say('THE LAST TRAIN IS AT THE FAR END OF THE PLATFORM',2.6);
  chime();
  canvas.requestPointerLock?.call(canvas)?.catch?.(()=>{});
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space')e.preventDefault();
  if(state!=='run'&&(e.code==='KeyR')){startRun()}
  if(state!=='run'&&(e.code==='KeyN')){seed=(Math.random()*0xffffffff)>>>0;startRun()}
});
addEventListener('keyup',e=>keys[e.code]=false);
let pointerLocked=false;
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===canvas});
addEventListener('mousemove',e=>{
  if(pointerLocked){
    P.yaw-=e.movementX*0.0023;
    P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-e.movementY*0.0023));
  }else if(state==='run'){
    P.yaw=-(e.clientX/innerWidth-0.5)*2.6;
    P.pitch=-(e.clientY/innerHeight-0.5)*1.6;
  }
});
overlay.addEventListener('click',()=>{
  ac();
  if(state==='win'||state==='lose')seed=(Math.random()*0xffffffff)>>>0;
  startRun();
});

/* ---------- collision ---------- */
function collide(){
  const r=0.35;
  /* walls */
  if(P.x> 3.65)P.x= 3.65;
  if(P.z> 3.6)P.z= 3.6;
  if(P.z<-PLAT_LEN+4)P.z=-PLAT_LEN+4;
  /* train side: solid at x=-4 except the door gap while open */
  const gapHalf=Math.max(0,0.85*doorOpen-0.22);
  const inDoor=Math.abs(P.z-DOOR_Z)<gapHalf;
  if(P.x<-3.65&&!inDoor){
    if(P.x<-3.4&&doorOpen<0.6&&Math.abs(P.z-DOOR_Z)<1.2){thump(.3);shake=Math.max(shake,.25)}
    P.x=-3.65;
  }
  /* boxes */
  for(const c of colliders){
    if(P.y>c.h-0.15)continue;
    if(P.x+r>c.minX&&P.x-r<c.maxX&&P.z+r>c.minZ&&P.z-r<c.maxZ){
      const dx1=c.maxX-(P.x-r),dx2=(P.x+r)-c.minX;
      const dz1=c.maxZ-(P.z-r),dz2=(P.z+r)-c.minZ;
      const m=Math.min(dx1,dx2,dz1,dz2);
      if(m===dx1)P.x=c.maxX+r;else if(m===dx2)P.x=c.minX-r;
      else if(m===dz1)P.z=c.maxZ+r;else P.z=c.minZ-r;
    }
  }
  /* people */
  for(const pe of people){
    const dx=P.x-pe.mesh.position.x,dz=P.z-pe.mesh.position.z;
    const d=Math.hypot(dx,dz),min=r+pe.r;
    if(d<min&&d>0.001){
      P.x=pe.mesh.position.x+dx/d*min;P.z=pe.mesh.position.z+dz/d*min;
      if(P.stumble<=0){P.stumble=0.8;shake=Math.max(shake,0.35);thump(.3);say('sorry! sorry—',1)}
    }
  }
}

/* ---------- endings ---------- */
function win(){
  state='win';winT=0;
  beep(660,.1,'sine',.1);beep(880,.1,'sine',.1,.1);beep(1320,.3,'sine',.1,.2);
  setTimeout(showEnd,1400);
}
function lose(msg){
  state='lose';loseT=0;doorGlow.visible=false;
  thump(.4);beep(220,.4,'sawtooth',.06,.1);
  say(msg,3);
  setTimeout(showEnd,2600);
}
function showEnd(){
  overlay.style.display='flex';
  const h=overlay.querySelector('h1');
  if(state==='win'){
    h.textContent='YOU MADE IT';h.style.color='#7dff9b';
    ovMsg.innerHTML=`<span class="result win">Boarded with ${tLeft.toFixed(1)}s to spare.</span>
      You collapse into a seat. A stranger nods. Attempt ${attempts}.`;
  }else{
    h.textContent='IT LEFT WITHOUT YOU';h.style.color='#ff5c5c';
    const dist=Math.max(0,Math.round(Math.abs(DOOR_Z-P.z)));
    ovMsg.innerHTML=`<span class="result lose">${dist}m short.</span>
      The tail lights shrink into the tunnel. Attempt ${attempts}. The night bus takes 2 hours.`;
  }
  ovGo.textContent='CLICK FOR NEW LAYOUT · R TO RETRY THIS ONE';
}

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  if(subTimer>0){subTimer-=dt;if(subTimer<=0)subEl.hidden=true}

  /* people wander whenever visible */
  for(const pe of people){
    pe.mesh.position.x=pe.baseX+Math.sin(t*pe.speed+pe.phase)*pe.amp;
    pe.mesh.position.x=Math.max(-3.4,Math.min(3.4,pe.mesh.position.x));
    pe.mesh.rotation.y=Math.cos(t*pe.speed+pe.phase)>0?Math.PI/2:-Math.PI/2;
  }

  if(state==='run'){
    tLeft-=dt;
    /* doors */
    if(tLeft<=3.5&&!announced){announced=true;chime();say('STAND CLEAR OF THE CLOSING DOORS',3)}
    if(tLeft<=3.5)doorOpen=Math.max(0,tLeft/3.5);
    doorL.position.z=DOOR_Z-0.85*Math.max(doorOpen,0.07);
    doorR.position.z=DOOR_Z+0.85*Math.max(doorOpen,0.07);

    /* movement */
    let ix=0,iz=0;
    if(keys.KeyW)iz-=1;if(keys.KeyS)iz+=1;
    if(keys.KeyA)ix-=1;if(keys.KeyD)ix+=1;
    const len=Math.hypot(ix,iz)||1;ix/=len;iz/=len;
    const sprinting=keys.ShiftLeft&&P.stam>0&&iz!==0;
    let speed=sprinting?8.0:4.6;
    if(P.stumble>0){P.stumble-=dt;speed*=0.35}
    P.stam+=sprinting?-16*dt:22*dt;
    P.stam=Math.max(0,Math.min(100,P.stam));
    /* slick zones: momentum */
    P.slick=0;
    for(const s of slickZones)if(Math.hypot(P.x-s.x,P.z-s.z)<s.r)P.slick=1;
    const cos=Math.cos(P.yaw),sin=Math.sin(P.yaw);
    const vx=(ix*cos + iz*sin)*speed, vz=(iz*cos - ix*sin)*speed;
    if(P.slick){
      P._vx=(P._vx??vx)*0.965+vx*0.035;P._vz=(P._vz??vz)*0.965+vz*0.035;
    }else{P._vx=vx;P._vz=vz}
    P.x+=P._vx*dt;P.z+=P._vz*dt;
    /* jump */
    if(keys.Space&&P.y<=0.001){P.vy=4.8;beep(300,.06,'triangle',.04)}
    P.vy-=12*dt;P.y=Math.max(0,P.y+P.vy*dt);
    if(P.y===0)P.vy=Math.max(P.vy,0);
    collide();
    /* footsteps + bob */
    const moving=(ix||iz)&&P.y===0;
    if(moving){
      bobT+=dt*(sprinting?13:8);stepT-=dt;
      if(stepT<=0){stepT=sprinting?0.28:0.42;beep(70+Math.random()*30,.04,'triangle',.05)}
    }
    /* win check: crossed into the train through the door */
    if(P.x<-3.9&&Math.abs(P.z-DOOR_Z)<1.1){win()}
    if(tLeft<=0){tLeft=0;lose('...the doors are shut.')}
    /* hud */
    timerEl.textContent=tLeft.toFixed(1);
    timerEl.classList.toggle('danger',tLeft<5);
    stamBar.style.width=P.stam+'%';
    stamBar.style.background=P.stam<25?'#ff5c5c':'#57d7e0';
  }
  if(state==='win'){
    winT+=dt;
    /* slide the camera into the carriage, doors shut behind */
    P.x+=(-5.2-P.x)*dt*3;
    doorOpen=Math.max(0,doorOpen-dt*1.5);
    doorL.position.z=DOOR_Z-0.85*Math.max(doorOpen,0.07);
    doorR.position.z=DOOR_Z+0.85*Math.max(doorOpen,0.07);
    if(winT>0.8)train.position.z-=winT*winT*2*dt*10;
    P.z+= (train.position.z+DOOR_Z-P.z)*dt*3;
    flashEl.style.opacity=Math.max(0,winT-1)*0.5;
  }
  if(state==='lose'){
    loseT+=dt;
    if(loseT>0.6)train.position.z-=Math.min((loseT-0.6)*4,18)*dt;
  }

  /* camera */
  const bob=(state==='run')?Math.sin(bobT)*0.05:0;
  shake=Math.max(0,shake-dt*1.4);
  const shx=(Math.random()-0.5)*shake*0.2,shy=(Math.random()-0.5)*shake*0.2;
  camera.position.set(P.x+shx,1.62+P.y+bob+shy,P.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;camera.rotation.x=P.pitch;
  camera.rotation.z=Math.sin(bobT*0.5)*0.008;
  const targetFov=(state==='run'&&keys.ShiftLeft&&P.stam>0)?82:74;
  camera.fov+=(targetFov-camera.fov)*dt*6;camera.updateProjectionMatrix();
  lamp.material.color.setHex(doorOpen>0.5?0x44ff77:0xff4444);

  renderer.render(scene,camera);
}
buildLayout();
tick();
</script>
</body>
</html>
